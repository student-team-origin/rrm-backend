spring:
  application:
    name: rrm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rrm_dev}
    username: ${DB_USER:rrm}
    password: ${DB_PASSWORD:rrm}
  jpa:
    open-in-view: false
    hibernate:
      # Schema este gestionată exclusiv de Flyway; Hibernate doar o validează.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

rrm:
  # Prefixul tuturor endpoint-urilor REST (vezi api-contract/openapi.yaml -> servers)
  api-prefix: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # Valoarea implicită este doar pentru dezvoltarea locală. În orice alt mediu, JWT_SECRET este
    # obligatoriu (minimum 32 de caractere).
    jwt-secret: ${JWT_SECRET:rrm-dev-secret-doar-pentru-dezvoltare-locala}
    access-token-ttl: 8h
    session-idle-timeout: 60m
    two-factor-challenge-ttl: 5m
